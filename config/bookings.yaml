# Historical taxi booking ingestion (optional). Map your dispatch export's column names to the canonical schema.
# Canonical: booking_id, booking_created_at, pickup_datetime, dropoff_datetime, pickup_postcode, dropoff_postcode,
#            pickup_lat, pickup_lon, dropoff_lat, dropoff_lon, fare, status, vehicle_type
column_map: {}          # e.g. { booking_id: "Job No", pickup_datetime: "Pickup Time", pickup_postcode: "From PC" }

correlation:
  radius_km: 1.0        # booking pickup/dropoff within this distance of the venue
  pre_minutes: 180      # dropoffs up to 3h before start
  post_minutes: 240     # pickups up to 4h after (estimated) end
  default_duration_min: 150

forecast:
  min_labelled_events: 200   # below this the system stays DETERMINISTIC and never reports a forecast
