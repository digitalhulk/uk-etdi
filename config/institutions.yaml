# Universities, colleges and schools. Registry-only: the collector never crawls institutions without an explicit
# public calendar URL (ical_url / rss_url / events_url). No student portals or login-protected systems.
# school_event_confidence: LOW|MEDIUM|HIGH — school events never auto-trigger marketing actions unless HIGH.
# verification_status as in councils.yaml. Probed 2026-09-18: no UK university exposed a discoverable public
# ICS/RSS/JSON-LD/tribe endpoint at conventional paths; several return 403 to automated clients.
institutions:
  - name: University of Manchester
    type: university
    city: Manchester
    region: North West
    website: https://www.manchester.ac.uk
    events_url: https://events.manchester.ac.uk/
    enabled: false
    verification_status: EMPTY
    notes: "Events page is JS rendered; no JSON-LD or feed found."
